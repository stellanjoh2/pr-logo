<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polyrig — Triangle Logo Reveal</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
      }
      #file-input {
        display: none;
      }
      #record-status {
        position: fixed;
        left: 16px;
        bottom: 16px;
        padding: 8px 12px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      #record-status.is-visible {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <input id="file-input" type="file" accept=".svg,image/svg+xml" />
    <div id="record-status"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
